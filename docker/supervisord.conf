; Zwei Prozesse in einem Container: nginx und php-fpm. Sauberer waeren zwei
; Container - dann waere das veroeffentlichte Abbild aber allein nicht
; lauffaehig, und genau das soll es sein.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -c /etc/nginx/nginx.conf
autostart=true
autorestart=true
; Nach php-fpm starten: nginx laeuft sonst kurz ins Leere und protokolliert
; beim Hochfahren Fehler, die keine sind.
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
