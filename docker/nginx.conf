# nginx im Container: ein Arbeiterprozess je Kern, kein Daemon - supervisord
# haelt ihn, und ein Prozess, der sich in den Hintergrund legt, gilt dort als
# beendet.
user www-data;
worker_processes auto;
daemon off;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Ins Protokoll des Containers statt in eine Datei im Inneren: So zeigt
    # "docker logs" die Zugriffe, statt dass man sie suchen muss.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    keepalive_timeout 65;

    # Die Anwendung nimmt Dateien bis 20 MB an (FileController). Ohne Luft
    # darueber bricht nginx den Upload ab, bevor die Regel ueberhaupt greift -
    # und der Nutzer saehe einen Serverfehler statt einer Meldung.
    client_max_body_size 24m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      image/svg+xml font/woff2;

    server {
        listen 8000;
        server_name _;
        root /app/public;
        index index.php;

        charset utf-8;

        # Laravel: alles, was keine Datei ist, geht an den Front Controller.
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Der eigentliche Gewinn gegenueber "artisan serve": CSS, JavaScript
        # und Bilder liefert nginx selbst aus, ohne PHP zu bemuehen. Der
        # Dateiname enthaelt bei Vite den Inhalts-Hash, deshalb darf lange
        # zwischengespeichert werden.
        location ^~ /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO       $fastcgi_path_info;
            # Grosse Antworten - etwa ein erzeugtes PDF - passen sonst nicht in
            # den Vorgabepuffer und landen in einer Datei auf der Platte.
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_read_timeout 120s;
        }

        # Punktdateien gehen niemanden etwas an - .env liegt zwar nicht unter
        # public/, aber die Regel kostet nichts.
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
