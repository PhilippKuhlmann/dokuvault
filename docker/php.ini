; Opcache: Ohne ihn liest PHP bei jeder Anfrage jede Datei neu ein und
; uebersetzt sie. Im Container aendert sich der Quelltext nie, deshalb darf
; die Pruefung auf Aenderungen ganz entfallen.
opcache.enable=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0

; Passend zur Regel der Anwendung (20 MB je Datei) mit etwas Luft fuer den
; Rest des Formulars.
upload_max_filesize=24M
post_max_size=24M
memory_limit=256M

; Ein PDF ueber viele Geraete braucht laenger als die Vorgabe von 30 Sekunden.
max_execution_time=120

; In einen Container gehoeren Fehler nach stderr, nicht in eine Datei im
; Inneren - sonst zeigt "docker logs" sie nicht.
log_errors=On
error_log=/dev/stderr
display_errors=Off
