# DokuVault zum Ausprobieren:
#
#   docker compose up
#
# Danach http://localhost:8000 - die Demo-Daten samt Zugaengen sind beim
# ersten Start schon angelegt (admin / password).

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # local, damit der Seeder die Demo-Daten anlegt statt nur der Startdaten.
      APP_ENV: local
      APP_DEBUG: "false"
      # In einen Container gehoeren Logs nach stderr, nicht in eine Datei im
      # Inneren: So zeigt "docker compose logs app" auch die Fehler, statt dass
      # man sie in storage/logs/ suchen muss.
      LOG_CHANNEL: stderr
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: dokuvault
      DB_USERNAME: dokuvault
      DB_PASSWORD: dokuvault
    volumes:
      # Hochgeladene Dateien, Sitzungen und Logs ueberleben so ein Neubauen
      # des Images. Beim ersten Start fuellt Docker das Volume aus dem Image,
      # die Verzeichnisstruktur unter storage/ ist also vorhanden.
      - dokuvault-storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: dokuvault
      MARIADB_USER: dokuvault
      MARIADB_PASSWORD: dokuvault
      MARIADB_ROOT_PASSWORD: dokuvault-root
    volumes:
      - dokuvault-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dokuvault-storage:
  dokuvault-db:
