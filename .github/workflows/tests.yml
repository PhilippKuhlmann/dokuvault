name: tests

on: [push, pull_request]

jobs:
  # Eigener Job statt eines Schritts in der Matrix: Der Code-Stil haengt weder
  # von der PHP- noch von der Datenbankversion ab, und die Antwort steht in
  # Sekunden fest statt nach dem Frontend-Build.
  stil:
    name: Code-Stil
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Pint
        run: ./vendor/bin/pint --test

  tests:
    name: PHP ${{ matrix.php }} / ${{ matrix.datenbank }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
        datenbank: [sqlite, mariadb]
        include:
          # composer.json erlaubt ^8.2, also auch 8.4. Getestet wird es hier
          # mit, aber nicht blockierend: Ein Bruch in einer PHP-Version, die
          # noch niemand einsetzt, soll nicht den Deploy der Demo aufhalten.
          - php: '8.4'
            datenbank: sqlite
            optional: true

    continue-on-error: ${{ matrix.optional || false }}

    # Der Dienst laeuft auch bei den SQLite-Durchgaengen mit. Das kostet ein
    # paar Sekunden und spart einen zweiten, fast identischen Job.
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: dokuvault_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # phpunit.xml setzt SQLite, ueberschreibt aber keine vorhandenen
    # Umgebungsvariablen - deshalb genuegt es, sie hier zu setzen.
    env:
      DB_CONNECTION: ${{ matrix.datenbank == 'mariadb' && 'mysql' || 'sqlite' }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ${{ matrix.datenbank == 'mariadb' && 'dokuvault_test' || ':memory:' }}
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, pdo_mysql, gd, zip

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets (Vite manifest wird von Feature-Tests benötigt)
        run: |
          npm ci
          npm run build

      - name: Run tests
        run: php artisan test
