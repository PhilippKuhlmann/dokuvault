name: docker

# Bewusst eine eigene Workflow und kein Job in "tests": Der Deploy haengt an
# "tests". Ein Bruch im Docker-Bild soll die Demo nicht am Aktualisieren
# hindern - und umgekehrt soll das Bild trotzdem bei jedem Push gebaut werden.
on:
  # Auf main ohne Pfadfilter: Das Bild traegt die Anwendung in sich, also macht
  # jede Codeaenderung das veroeffentlichte "latest" veraltet. Auf allen anderen
  # Zweigen genuegt es, bei Aenderungen am Bild selbst zu bauen.
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  bauen:
    name: Bauen und starten
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Image bauen und hochfahren
        run: docker compose up -d --build

      - name: Auf die Anwendung warten
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/login || true)
            if [ "$code" = "200" ]; then
              echo "Erreichbar nach etwa $((i * 5)) Sekunden."
              exit 0
            fi
            sleep 5
          done
          echo "Nach fuenf Minuten keine Antwort auf http://localhost:8000/login."
          exit 1

      - name: Anmeldeseite pruefen
        run: |
          seite=$(curl -s http://localhost:8000/login)
          echo "$seite" | grep -q 'name="username"' || { echo 'Kein Anmeldeformular gefunden.'; exit 1; }
          echo "$seite" | grep -q 'Anmelden' || { echo 'Seite geladen, aber ohne erwarteten Inhalt.'; exit 1; }

      # Der eigentliche Beweis, dass Migrationen und Seeder gelaufen sind: Ohne
      # sie gaebe es den Demo-Kunden nicht, und die Anmeldung schluege fehl.
      - name: Anmeldung mit dem Demo-Zugang
        run: |
          keks=$(mktemp)
          token=$(curl -s -c "$keks" http://localhost:8000/login \
            | grep -o 'name="_token" value="[^"]*"' | head -1 | cut -d'"' -f4)
          code=$(curl -s -b "$keks" -c "$keks" -o /dev/null -w '%{http_code}' \
            -X POST http://localhost:8000/login \
            --data-urlencode "_token=$token" \
            --data-urlencode 'username=admin' \
            --data-urlencode 'password=password')
          echo "Antwort auf die Anmeldung: HTTP $code"
          [ "$code" = "302" ] || { echo 'Keine Weiterleitung - Anmeldung fehlgeschlagen.'; exit 1; }

          # Der Statuscode allein genuegt nicht: Laravel antwortet auch auf eine
          # abgelehnte Anmeldung mit 302, nur eben zurueck auf das Formular.
          # Beweisend ist erst eine Seite, die nur Angemeldete sehen.
          nachher=$(curl -s -L -b "$keks" http://localhost:8000/)
          echo "$nachher" | grep -q 'Abmelden' \
            || { echo 'Nach der Anmeldung keine angemeldete Sitzung.'; exit 1; }
          echo "$nachher" | grep -q 'Mustermann' \
            || { echo 'Angemeldet, aber ohne Demo-Daten - Seeder nicht gelaufen?'; exit 1; }

      # Beweist, dass nginx tut, wofuer es da ist: Ohne die /build/-Regel
      # liefe auch eine CSS-Datei durch PHP, und der Umbau haette nichts
      # gebracht ausser mehr Teilen.
      - name: nginx liefert die statischen Dateien selbst aus
        run: |
          kopf=$(curl -s -D - -o /dev/null http://localhost:8000/login)
          echo "$kopf" | grep -qi '^server: nginx' \
            || { echo 'Antwort kommt nicht von nginx.'; echo "$kopf"; exit 1; }

          # Den Namen der gebauten CSS-Datei aus der Seite ziehen: Er traegt
          # einen Inhalts-Hash und ist bei jedem Build ein anderer.
          pfad=$(curl -s http://localhost:8000/login \
            | grep -o '/build/assets/app\.[a-z0-9]*\.css' | head -1)
          [ -n "$pfad" ] || { echo 'Keine gebaute CSS-Datei in der Seite gefunden.'; exit 1; }

          kopf=$(curl -s -D - -o /dev/null "http://localhost:8000$pfad")
          echo "$kopf" | grep -q '^HTTP/1.1 200' \
            || { echo "CSS nicht ausgeliefert: $pfad"; echo "$kopf"; exit 1; }
          echo "$kopf" | grep -qi 'cache-control: public, immutable' \
            || { echo 'Ohne Cache-Header - die /build/-Regel hat nicht gegriffen.'; echo "$kopf"; exit 1; }
          echo "nginx liefert $pfad mit dauerhaftem Cache aus."

      - name: Opcache ist aktiv
        run: |
          # Ohne Opcache uebersetzt PHP jede Datei bei jeder Anfrage neu.
          docker compose exec -T app php -r 'exit(opcache_get_status(false) ? 0 : 1);' \
            || { echo 'Opcache laeuft nicht.'; exit 1; }
          echo 'Opcache ist an.'

      - name: Logs bei Fehlschlag
        if: failure()
        run: docker compose logs --no-color

      - name: Aufraeumen
        if: always()
        run: docker compose down -v

  veroeffentlichen:
    name: Auf Docker Hub veroeffentlichen
    needs: bauen
    runs-on: ubuntu-latest

    # Nur vom eigenen Zweig aus, nie aus einem Pull Request: Dort stehen die
    # Zugangsdaten nicht zur Verfuegung, und ein fremder Beitrag soll ohnehin
    # nichts veroeffentlichen koennen.
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v7

      # Ohne hinterlegte Zugangsdaten wird nicht veroeffentlicht - der Lauf
      # bleibt gruen und sagt, was fehlt. Sonst waere der Workflow bei jedem
      # Klon rot, ohne dass etwas kaputt waere.
      - name: Zugangsdaten pruefen
        id: zugang
        env:
          BENUTZER: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$BENUTZER" ] || [ -z "$TOKEN" ]; then
            echo 'Keine Docker-Hub-Zugangsdaten hinterlegt - es wird nur gebaut, nicht veroeffentlicht.'
            echo 'Dafuer die Geheimnisse DOCKERHUB_USERNAME und DOCKERHUB_TOKEN setzen.'
            echo 'vorhanden=nein' >> "$GITHUB_OUTPUT"
          else
            echo 'vorhanden=ja' >> "$GITHUB_OUTPUT"
          fi

      # Die Version steht im Changelog, nicht in einer eigenen Datei - dieselbe
      # Quelle, aus der die Oberflaeche sie liest (AppServiceProvider).
      - name: Version aus dem Changelog lesen
        if: steps.zugang.outputs.vorhanden == 'ja'
        id: version
        run: |
          version=$(grep -m1 -oE '^## [0-9]{2}\.[0-9]{2}\.[0-9]{2}' changelog.md | cut -d' ' -f2)
          [ -n "$version" ] || { echo 'Keine Version im Changelog gefunden.'; exit 1; }
          echo "wert=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      # arm64 zusaetzlich, damit das Bild auch auf einem Mac mit Apple-Silicon
      # und auf einem Raspberry laeuft, ohne Emulation beim Nutzer.
      - name: QEMU fuer fremde Architekturen
        if: steps.zugang.outputs.vorhanden == 'ja'
        uses: docker/setup-qemu-action@v3

      - name: Buildx einrichten
        if: steps.zugang.outputs.vorhanden == 'ja'
        uses: docker/setup-buildx-action@v3

      - name: Bei Docker Hub anmelden
        if: steps.zugang.outputs.vorhanden == 'ja'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Bauen und hochladen
        if: steps.zugang.outputs.vorhanden == 'ja'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # "latest" zeigt auf den letzten Stand von main, die Version auf einen
          # festen. Wer reproduzierbar betreiben will, nimmt die Version.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dokuvault:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/dokuvault:${{ steps.version.outputs.wert }}
          # Zwischenstufen zwischen den Laeufen behalten: Ohne das baut jeder
          # Lauf Composer- und npm-Abhaengigkeiten neu.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  beschreibung:
    name: Beschreibung auf Docker Hub
    runs-on: ubuntu-latest

    # Bewusst ohne "needs: bauen": Eine Textaenderung an der Seite soll nicht
    # zwanzig Minuten Multi-Arch-Bau nach sich ziehen. Ein Abbild wird hier
    # weder gebaut noch angefasst.
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v7

      - name: Zugangsdaten pruefen
        id: zugang
        env:
          BENUTZER: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$BENUTZER" ] || [ -z "$TOKEN" ]; then
            echo 'Keine Docker-Hub-Zugangsdaten hinterlegt - die Beschreibung bleibt, wie sie ist.'
            echo 'vorhanden=nein' >> "$GITHUB_OUTPUT"
          else
            echo 'vorhanden=ja' >> "$GITHUB_OUTPUT"
          fi

      # Der Name steht nicht im Quelltext: Er kommt aus demselben Geheimnis,
      # aus dem auch der Bildname gebildet wird. So zeigt das Beispiel auf der
      # Seite immer auf genau das Repository, auf dem es steht - und bliebe
      # richtig, wenn der Name sich einmal aendert.
      - name: Platzhalter durch den echten Namen ersetzen
        if: steps.zugang.outputs.vorhanden == 'ja'
        env:
          BENUTZER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          sed -i "s|<BENUTZER>|$BENUTZER|g" docker/HUB.md
          grep -q '<BENUTZER>' docker/HUB.md && { echo 'Es blieb ein Platzhalter stehen.'; exit 1; }
          echo 'Beispiel in der Beschreibung:'
          grep -n 'image:' docker/HUB.md

      - name: Hochladen
        if: steps.zugang.outputs.vorhanden == 'ja'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/dokuvault
          short-description: 'IT-Dokumentation für Systemhäuser und interne IT'
          readme-filepath: ./docker/HUB.md
