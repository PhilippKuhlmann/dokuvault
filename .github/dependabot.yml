version: 2

# Woechentlich statt taeglich: Bei einem Projekt dieser Groesse sind taegliche
# Aktualisierungen mehr Rauschen als Nutzen. Gruppiert, damit nicht fuenf
# Patch-Updates fuenf Pull Requests ergeben.
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      php-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      js-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
